  <p class="lead">A lightweight jQuery solution for translating text on a website into multiple languages.</p>
<h1 data-language="fr">Bonjour le monde!</h1>
<h1 data-language="en">Hello World!<h1>
<h1 data-language="es">¡Hola Mundo!</h1>
<h5>Language Switcher:</h5>
<select id="select" class="form-control my-3">
    <option value="fr">French</option>
    <option value="en">English</option>
    <option value="es">Spanish</option>
</select>
</div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="lib/index.js"></script>
<script>
  // select French as initial language
  $.setLanguage({attribute: "data-language", lang: "fr"});

  // on change
  $("#select").on("change", function () {
    // set the new language
    $.setLanguage({
      attribute: "data-language",
      lang: $(this).val()
    });
  });
