<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入</title>
    <!-- narBar -->
    <link rel="stylesheet" href="../CSS/navBar.css">
    <link rel="stylesheet" href="../CSS/members.css">
    <style>
        html,
        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- narBar -->
    <div id="nav-placeholder"></div>
    <!-- Login -->
    <h3>會員登入</h3>
    <form id="loginBox">
        <div class="memberemailGroup">
            <label for="memberEmail" id="loginboxText">電子郵件</label>
            <input type="email" id="memberEmail" required>
        </div>

        <div class="pswGroup">
            <label for="memberPsw" id="loginboxText">密碼</label>
            <input type="password" id="memberPsw" required pattern="[a-zA-Z0-9]+">
        </div>
            <button id="loginButton" type="submit"><b>登入</b></button>
        <a href="./setup.html">註冊會員</a>
    </form>
    <!-- narBar -->
    <script src="../JS/loadNav.js"></script>
    <!-- member -->
    <script src="../JS/mfront.js"></script>

</body>
