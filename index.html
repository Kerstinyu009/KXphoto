<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KXphoto</title>
    <link class="navIcon" rel="icon" href="./img/logo.png">
    <link rel="stylesheet" href="./CSS/navBar.css">
    <!-- Carousel  -->
    <link rel="stylesheet" href="./JS/image-video-carousel-qc/css/qc.slider.css">
    <script src="./JS/jQuery.js"></script>
    <script src="./JS/image-video-carousel-qc/qcslider.jquery.js"></script>
    <!-- lightBix -->
    <link rel="stylesheet" href="./CSS/lightBix.css">
    <style>
        body {
            background-color: black;
        }

        h2 {
            color: white;
            text-align: center;
            font-size: 30px;
            margin-bottom: 5px;
        }

        hr {
            width: 5%;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }

        .gallery img {
            width: 100%;
            height: 400px;
            margin-bottom: 10px;
            object-fit: cover;
            box-sizing: border-box;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .gallery img:hover {
            transform: scale(1.04);
            filter: brightness(1.15);
        }

        .imgText {
            color: aliceblue;
            text-align: center;
            font-size: 20px;
        }

        .newText {
            color: white;
            text-align: center;
            font-size: 30px;
        }
    </style>

</head>

<body>
    <!-- navBar -->
    <nav class="navContainer">
        <div class="navLeft">
            <a href="./index.html" title="KXphoto">
                <img class="navlogo" src="./img/logo-3.png" alt="LOGO">
            </a>
        </div>

        <!-- Right-side menu-->
        <ul class="navUl">
            <li><a href="./index.html">首頁</a></li>
            <li><a href="./pages/about.html" target="_self">關於</a></li>

            <!-- Drop-down nav -->
            <li class="dropdown">
                <a href="javascript:void(0)">圖片</a>
                <div class="dropdownContent">
                    <a href="./pages/natureimg.html">自然</a>
                    <a href="./pages/peopleimg.html">人文</a>
                    <a href="./pages/life.html">生活</a>
                </div>
            </li>

        </ul>
    </nav>
    <!-- Carousel -->
    <section class="slide">
        <div class="slider-container">
            <ul class="slider-wrapper" id="slider">
                <li class="slide-current">
                    <!-- Image -->
                    <img src="./img/Taichung/20240810_1626.jpg" />
                </li>
                <li>
                    <img src="./img/Taichung/20260118_153820 .jpg" />
                </li>
                <li>
                    <img src="./img/Tainan/20250302_142414.jpg" />
                </li>
                <li>
                    <img src="./img/Yunlin/20241006_0947.jpg" />
                </li>

            </ul>
            <!-- Nav controls -->
            <div class="drt-control control-left" id="lft-control"></div>
            <div class="drt-control control-right" id="rht-control"></div>
            <ul class="slider-controls" id="slider-controls"></ul>
            <!-- Progressbar -->
            <div class="tempo-bar" id="barra"></div>
        </div>
    </section>


    <!-- Select img -->
    <h2>精選</h2>
    <hr>
    <div class="gallery">
        <div class="gallery_item" onclick="openModal('./img/Taichung/20260511_173817.jpg', '台中-中央公園')">
            <img src="./img/Taichung/20260511_173817.jpg">
            <div class="imgText">台中-中央公園</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/Kaohsiung/20241221_v2.jpg', '高雄-高雄港')">
            <img src="./img/Kaohsiung/20241221_v2.jpg">
            <div class="imgText">高雄-高雄港</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/New Taipei/20240119_165348.jpg', '新北-平溪')">
            <img src="./img/New Taipei/20240119_165348.jpg">
            <div class="imgText">新北-平溪</div>
        </div>
        <div class="gallery_item" onclick="openModal('./img/Yunlin/20241005_v1.jpg', '雲林-西螺')">
            <img src="./img/Yunlin/20241005_v1.jpg">
            <div class="imgText">雲林-西螺</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/Taipei/20241027_125103.jpg', '台北-松山機場')">
            <img src="./img/Taipei/20241027_125103.jpg">
            <div class="imgText">台北-松山機場</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/Taipei/20250111.jpg', '台北-西門町')">
            <img src="./img/Taipei/20250111.jpg">
            <div class="imgText">台北-西門町</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/Taichung/20240817_0630.jpg', '台中-東海大學')">
            <img src="./img/Taichung/20240817_0630.jpg">
            <div class="imgText">台中-東海大學</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/Taichung/20251004_1224.jpg', '台中-西屯')">
            <img src="./img/Taichung/20251004_1224.jpg">
            <div class="imgText">台中-西屯</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/Yunlin/20241005.jpg', '雲林-西螺')">
            <img src="./img/Yunlin/20241005.jpg">
            <div class="imgText">雲林-西螺</div>
        </div>

        <div class="gallery_item" onclick="openModal('./img/Taichung/20251024.jpg', '台中-美術館')">
            <img src="./img/Taichung/20251024.jpg">
            <div class="imgText">台中-美術館</div>
        </div>

    </div>

    <!-- lightBox -->
    <div id="lightBox" class="modal">
        <span id="closeModal" class="close" onclick="closeModal()">&times;</span>
        <img id="lightBoxImg" class="modalBox">
        <div id="lightBoxText"></div>
    </div>

    <script>
        // Carousel  duration
        $(document).ready(function ($) {
            $("#slider").QCslider({
                duration: 5000
            });
        });

        // lightBox
        function openModal(imgSrc) {
            document.getElementById("lightBox").style.display = "flex"
            document.getElementById("lightBoxImg").src = imgSrc;
        };

        // close botton
        function closeModal() {
            document.getElementById("lightBox").style.display = "none";

        };

    </script>

    <!-- Top buttom -->
    <a href="#" class="top"><b>top</b></a>
</body>

</html>
