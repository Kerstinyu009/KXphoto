<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KXphoto</title>
    <link class="navIcon" rel="icon" href="./img/logo.png">
    <link rel="stylesheet" href="./CSS/navBar.css">
    <!--  輪播圖  -->
    <link rel="stylesheet" href="./JS/image-video-carousel-qc/css/qc.slider.css">
    <script src="./JS/jQuery.js"></script>
    <script src="./JS/image-video-carousel-qc/qcslider.jquery.js"></script>

    <style>
        body {
            background-color: black;
        }

        h2 {
            color: white;
        }

        /* 輪播圖css */
        :root {
            --opacity-slide: 0.5;
            --height-slider: 500px;
            --color-slider: white;
            --height-responsive: 500px;
        }

        .capa {
            color: white;
            font-size: 30px;
            text-align: right;
        }
    
    </style>

</head>

<body>
    <!-- 導覽列 -->
    <nav class="navContainer">
        <div class="navLeft">
            <a href="./index.html">
                <img class="navlogo" src="./img/logo-3.png" alt="LOGO">
            </a>
        </div>

        <!-- 右側選單-->
        <ul class="navUl">
            <li><a href="./index.html">首頁</a></li>
            <li><a href="./pages/about.html" target="_self">關於</a></li>

            <!-- 下拉式導覽 -->
            <li class="dropdown">
                <a href="javascript:void(0)">圖片</a>
                <div class="dropdownContent">
                    <a href="./pages/natureimg.html">自然</a>
                    <a href="./pages/peopleimg.html">人文</a>
                    <a href="./pages/life.html">生活</a>
                </div>
            </li>

            <li>
                <select class="lang-select">
                    <option value="">請選擇語言</option>
                    <option value="./pages/lang.html">中文</option>
                    <option value="./pages/lang.html">English</option>
                    <option value="./pages/lang.html">日本語</option>
                    <option value="./pages/lang.html">แบบไทย</option>
                </select>
            </li>
        </ul>
    </nav>


    <!-- 輪播圖 -->
    <section class="slide">
        <div class="slider-container">
            <ul class="slider-wrapper" id="slider">
                <li class="slide-current">
                    <!-- Image -->
                    <img src="./img/Taichung/20260511_172912.jpg" />
                    <!-- Image Description -->
                    <!-- <div class="capa"><b>高美濕地</b></div> -->
                </li>
                <li>
                    <!-- Image -->
                    <img src="./img/Miaoli/20240810_0854.jpg" />
                    <!-- Image Description -->
                    <div class="capa"></div>
                </li>
            </ul>
            <!-- Nav controls -->
            <div class="drt-control control-left" id="lft-control"></div>
            <div class="drt-control control-right" id="rht-control"></div>
            <ul class="slider-controls" id="slider-controls"></ul>
            <!-- Progressbar -->
            <div class="tempo-bar" id="barra"></div>
        </div>
    </section>
    <script>
        $(document).ready(function ($) {
            $("#slider").QCslider({
                // options here
            });
        });

        $(document).ready(function ($) {
            $("#slider").QCslider({
                duration: 5000
            });
        });
    </script>

    <!-- 精選圖片 -->
    <h2>精選圖片</h2>

    <!-- 回到頂部按鈕 -->
    <a href="#" class="top"><b>top</b></a>

    <!-- 測試滾動用空間
    <div style="height: 2000px; padding: 20px;">
        <h2>網頁內容區域</h2> -->
    </div>
